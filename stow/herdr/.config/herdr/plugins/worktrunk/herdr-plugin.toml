id = "andreccosta.worktrunk"
name = "Worktrunk"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Tiny Herdr plugin that delegates worktree operations to Worktrunk."
platforms = ["linux", "macos"]

[[actions]]
id = "create"
title = "Worktree via Worktrunk: create"
description = "Create a worktree with Worktrunk (`wt switch --create`) and open it in Herdr."
contexts = ["workspace", "tab", "pane"]
command = ["bin/herdr-worktrunk", "action", "create"]

[[actions]]
id = "open"
title = "Worktree via Worktrunk: open"
description = "Pick an existing Worktrunk worktree and open it in Herdr."
contexts = ["workspace", "tab", "pane"]
command = ["bin/herdr-worktrunk", "action", "open"]

[[actions]]
id = "remove"
title = "Worktree via Worktrunk: remove current"
description = "Remove the current worktree with Worktrunk (`wt remove`) and close the Herdr workspace."
contexts = ["workspace", "tab", "pane"]
command = ["bin/herdr-worktrunk", "action", "remove"]

[[panes]]
id = "runner"
title = "Worktrunk"
description = "Interactive Worktrunk operation runner."
placement = "popup"
width = "80%"
height = "70%"
command = ["bash", "-lc", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-worktrunk\" runner"]
