onboarding = false

[keys]
prefix = "backtick"
new_worktree = ""
remove_worktree = ""

[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false
status_indicators = "symbols"
show_agent_labels_on_pane_borders = false

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "andreccosta.worktrunk.create"
description = "Worktree via Worktrunk: create"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "andreccosta.worktrunk.open"
description = "Worktree via Worktrunk: open"

[[keys.command]]
key = "prefix+alt+r"
type = "plugin_action"
command = "andreccosta.worktrunk.remove"
description = "Worktree via Worktrunk: remove current"

[theme]
name = "tokyo-night"
auto_switch = false
