[tools]
claude = "latest"
codex = "latest"
go = "latest"
herdr = "latest"
node = "lts"
opencode = "latest"
pi = "latest"
pnpm = "latest"
python = "prefix:3.14"
ruby = "latest"
rust = "latest"
zig = "latest"

[settings]
env_shell_expand = true
idiomatic_version_file_enable_tools = ["ruby"]
minimum_release_age = "12h"
minimum_release_age_excludes = ["claude", "codex", "herdr", "opencode", "pi", "npm:paseo"]

[settings.ruby]
compile = false

[settings.npm]
package_manager = "pnpm"

[env]
RUBY_CONFIGURE_OPTS = "--with-gmp --with-jemalloc --disable-install-doc"
